name: hehe

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Catatan perbaikan (2026-11-01):
# - Action versi lama dinaikkan (setup-node v2 -> v4, setup-go -> v5 + cache bawaan)
# - 9router DIPIN ke 0.5.111 (versi produksi) & cuma diinstall pas cache miss.
#   Dulu "9router@latest" keinstall tiap run -> versi otak bisa berubah sendiri.
# - Backup PENUH berkala (wa33 + .9router) tiap 20 menit dari step run.
#   Dulu .9router ga pernah kesync selama run -> token antigravity bisa basi/
#   ke-rotate pas restore = "data hilang". Sekarang ikut keflush berkala.
# - Penerus: workflow yang di-CANCEL user sekarang BENERAN berhenti.
#   Dulu cancel pun tetap dispatch run baru (bot nyala lagi sendiri).
# - PINDAHAN TOTAL: profil Chrome (muse + pixiv) & antibokep-ai & bgutil-pot
#   ikut direstore dari Drive (profiles.tar.gz & antibokep-ai.tar.gz di folder
#   wa33-backup), jalan bareng bot, dan profil Chrome diupload ulang tiap
#   run selesai biar sesi ga basi antar-estafet.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: /home/runner
    steps:

      - name: nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: golang
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Restore apt
        id: cache-apt
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/aptcache
          key: ${{ runner.os }}-apt-v3

      - name: apt
        run: |
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" = "true" ] && ls /home/runner/aptcache/*.deb >/dev/null 2>&1; then
            echo "apt dari cache, tinggal pasang"
            sudo dpkg -i /home/runner/aptcache/*.deb || sudo apt-get -f install -y
            exit 0
          fi
          mkdir -p /home/runner/aptcache/partial
          sudo apt-get update -y
          sudo apt-get install -y \
            -o Dir::Cache::archives=/home/runner/aptcache \
            -o Debug::NoLocking=1 \
            -o APT::Keep-Downloaded-Packages=true \
            ffmpeg sox imagemagick webp tigervnc-standalone-server icewm \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            aria2 xvfb screen
          sudo chown -R runner:runner /home/runner/aptcache
          rm -rf /home/runner/aptcache/partial /home/runner/aptcache/lock

      - name: Save apt
        if: steps.cache-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/aptcache
          key: ${{ runner.os }}-apt-v3

      - name: Chrome
        run: |
          if ! google-chrome --version >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo dpkg -i /tmp/chrome.deb || sudo apt-get -f install -y
          fi
          google-chrome --version

      - name: Restore tool npm
        id: cache-tool
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/npmglobal
            /home/runner/node_modules
          key: ${{ runner.os }}-npmtool-v4

      - name: Tool npm
        run: |
          npm config set prefix /home/runner/npmglobal
          echo "/home/runner/npmglobal/bin" >> $GITHUB_PATH
          if [ "${{ steps.cache-tool.outputs.cache-hit }}" != "true" ]; then
            npm i -g pm2 @anthropic-ai/claude-code@2.1.112
            npm i --no-save gdrive@github:frmdeveloper/gdrive-node socks-proxy-agent
            npm i -g 9router@0.5.111
          fi

      - name: Save tool npm
        if: steps.cache-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/npmglobal
            /home/runner/node_modules
          key: ${{ runner.os }}-npmtool-v4

      - name: Tulis gd.js
        env:
          GD_JS: ${{ secrets.GD_JS }}
        run: |
          mkdir -p wa33
          printf '%s' "$GD_JS" | base64 -d > wa33/gd.js

      - name: Restore dari Drive
        run: |
          node wa33/gd.js restore
          node wa33/gd.js restore

      - name: Patch cari yt (yt-search 302)
        run: |
          python3 - <<'PYEOF'
          import io
          def patch(path, pairs):
              try:
                  s = io.open(path, encoding="utf-8").read()
              except Exception as e:
                  print("patch skip (baca gagal):", path, e); return
              if "cariYtdlp" in s:
                  print("patch: sudah ada di", path); return
              for lama, _ in pairs:
                  if lama not in s:
                      print("patch skip (anchor hilang):", path, "->", lama[:50]); return
              s = s.replace("const oh = async(conn,m) => {", HELPER + "const oh = async(conn,m) => {", 1)
              for lama, baru in pairs:
                  s = s.replace(lama, baru, 1)
              io.open(path, "w", encoding="utf-8").write(s)
              print("patch: OK", path)

          HELPER = r'''
          // yt-search scrape halaman /results — dari sebagian IP (mis. GitHub Actions)
          // YouTube ngasih 302 (consent/bot) -> error "http status: 302". Cari lewat
          // yt-dlp (innertube + cookie) jauh lebih tahan banting; hasil disamakan
          // bentuknya kayak yt-search biar pemakai di bawah gak berubah.
          const cariYtdlp = async(q, n = 4) => {
              const aman = String(q).replace(/(["$`\\])/g, "\\$1")
              const {output} = await spawnSync(`./bantuan/ytdlp "ytsearch${n}:${aman}" --cookies "./bantuan/cookie-yt.txt" --js-runtimes node --flat-playlist -j`)
              const hasil = []
              for (const baris of (output||"").split("\n")) {
                  try {
                      const v = JSON.parse(baris)
                      if (v.id) hasil.push({videoId: v.id, url: v.webpage_url || "https://www.youtube.com/watch?v="+v.id, title: v.title || "", image: "https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg", author: {name: v.uploader || ""}, timestamp: v.duration_string || ""})
                  } catch {}
              }
              return hasil
          }
          const cariVideo = async(q, n = 4) => {
              try {
                  const {videos} = await yts(q)
                  if (videos?.length) return videos
              } catch {}
              return cariYtdlp(q, n)
          }
          '''

          patch("wa33/fitur/downloader/ytplay.js", [
            (r"""        const {videos} = await yts(m.q)
                  if (!videos[0]) throw new Error("Video gak ketemu")""",
             r"""        const videos = await cariVideo(m.q)
                  if (!videos[0]) throw new Error("Video gak ketemu")"""),
          ])
          patch("wa33/fitur/downloader/ytdl.js", [
            (r"""          const info = await yts({videoId: idMatch[1]})
                    const judul = info?.title
                    if (judul) {
                      const {videos} = await yts(judul)""",
             r"""          const {output: judulOut} = await spawnSync(`./bantuan/ytdlp "https://www.youtube.com/watch?v=${idMatch[1]}" --cookies "./bantuan/cookie-yt.txt" --js-runtimes node --skip-download --print "%(title)s"`)
                    const judul = (judulOut||"").trim().split("\n")[0]
                    if (judul) {
                      const videos = await cariVideo(judul)"""),
          ])
          patch("wa33/fitur/info/ytsearch.js", [
            (r"""    const {videos} = await yts(m.q)""",
             r"""    const videos = await cariVideo(m.q, 10)"""),
          ])

          PYEOF
      - name: Patch teks sabar
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/downloader/ytplay.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          baris = '            await conn.ok(m,"sabar lagi donlod audio ny")\n'
          if baris in s:
              s = s.replace(baris, "", 1)
              io.open(p, "w", encoding="utf-8").write(s)
              print("patch: teks sabar dihapus dari ytplay")
          else:
              print("patch: teks sabar udah gak ada")
          PYEOF

      - name: Patch infoanime 404
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/info/animeinfo.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if ".catch(() => null)" in s:
              print("patch: infoanime udah dipatch"); raise SystemExit(0)
          a1 = '    const cari = await axios.get("https://myanimelist.net/anime.php?cat=anime&q="+q)'
          b1 = a1 + '.catch(() => null)\n    if (!cari) return null'
          a2 = '    const lihat = await axios.get(linkanime)'
          b2 = a2 + '.catch(() => null)\n    if (!lihat) return null'
          if a1 not in s or a2 not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          s = s.replace(a1, b1, 1).replace(a2, b2, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: infoanime 404 -> gak nemu")
          PYEOF

      - name: Patch mcp tag bocor
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/ai/mcp.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if "buang tag scaffolding model" in s:
              print("patch: mcp tag bocor udah dipatch"); raise SystemExit(0)
          anchor = 'function siapkanTag(teks) {\n    let hasil = String(teks ?? "")'
          baru = anchor + '\n    // buang tag scaffolding model yg bocor ke balasan (mis. </state> di ujung teks)\n    hasil = hasil\n        .replace(/<\\/?(state|think|thinking|scratchpad|reasoning|reflection|output|response|answer|content|message|reply|system|prompt|context|analysis|commentary|final|result)(\\s[^>]*)?\\/?>/gi, "")\n        .replace(/<\\|[^|]*\\|>/g, "")\n        .replace(/<\\/([a-zA-Z][\\w-]*)\\s*>\\s*$/, (cocok, nama) => (hasil.includes("<" + nama) ? cocok : ""))\n        .trimEnd()'
          if anchor not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          s = s.replace(anchor, baru, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: mcp tag bocor dibersihkan di siapkanTag")
          PYEOF

      - name: Patch mcp tolak ngoding
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/ai/mcp.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if "NGODING / bikinin sesuatu" in s:
              print("patch: mcp tolak ngoding udah dipatch"); raise SystemExit(0)
          anchor = "  nyuruh-nyuruh — tetap dikerjain kayak biasa.\n"
          baru = anchor + "- Ada yang nyuruh lo NGODING / bikinin sesuatu yang isinya code (script, program,\n  web, bot, dsb) dan lo GAK BISA beneran ngerjainnya sampe beres? Mending TOLAK\n  DENGAN KERAS sekalian, gaya nolak kayak di atas (\"gamau anj\", \"diem lu\",\n  \"ngoding sendiri sana\") — JANGAN ngeluarin code ngawur / setengah jadi /\n  sok-sokan bisa. Kalo lo emang bisa ngerjainnya beneran, ya kerjain kayak biasa.\n"
          if anchor not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          s = s.replace(anchor, baru, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: aturan tolak ngoding ditambahkan ke persona mcp")
          PYEOF

      - name: Patch mcp kosakata
        run: |
          python3 - <<'PYEOF'
          import io
          def terapkan(p, pairs):
              try:
                  s = io.open(p, encoding="utf-8").read()
              except Exception as e:
                  print("patch skip (baca gagal)", p, e); return
              n = 0
              for a, b in pairs:
                  if a in s:
                      s = s.replace(a, b); n += 1
              if n:
                  io.open(p, "w", encoding="utf-8").write(s)
              print("patch kosakata:", p, n, "pasang")
          terapkan("wa33/fitur/ai/mcp.js", [
              ('"anj ngomong apa lu"', '"njir ngomong apa lu"'),
              ('"anj bisa ngomong bener gak sih"', '"njir bisa ngomong bener gak sih"'),
              ('"anj apasih"', '"njir apasih"'),
              ('awali "anj" atau "njir" (salah satu aja),', 'awali "njir" / "jir" / "anjir" / "njirlah" (salah satu aja),'),
              ('"anj bumbu kuning tai apaan"', '"njir bumbu kuning tai apaan"'),
              ('"anj seriusan?"', '"njir seriusan?"'),
              ('kaget/absurd, njir/anj justru wajib dipakai. Di luar konteks itu tetep jarang.', 'kaget/absurd, njir/jir justru wajib dipakai. Di luar konteks itu tetep jarang.\n- Kata "anj" sama "cok" JANGAN dipakai sama sekali — kasar. Gantinya selalu: njir, jir, anjir, njirlah.'),
              ('variasinya kayak "apa cok", "apa anj",', 'variasinya kayak "apa jir", "apa njir",'),
              ('"gamau anj"', '"gamau jir"'),
              ('awali anj/njir, cukup segitu', 'awali njir/jir, cukup segitu'),
              ('"masuk cok"', '"masuk jir"'),
          ])
          terapkan("wa33/conn.js", [('"masuk cok"', '"masuk jir"')])
          PYEOF

      - name: Patch antibokep ambang
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/group/antibokep.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if "ambangNude" in s:
              print("patch: antibokep ambang udah dipatch"); raise SystemExit(0)
          anchor = '    if (s.nude >= 0.6 || s.db >= 0.5) { console.log(`[antibokep] lokal nude=${s.nude} db=${s.db} hp=${s.hp} sexy=${s.sexy} -> PORNO`); return "PORNO" }'
          if anchor not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          baru = "    const ambangNude = opsi.tanpaRouter ? 0.6 : 0.85\n" + anchor.replace("s.nude >= 0.6", "s.nude >= ambangNude")
          s = s.replace(anchor, baru, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: ambang PORNO lokal nude 0.6 -> 0.85 (band tengah eskalasi visi); tanpaRouter tetap 0.6")
          PYEOF

      - name: Patch antibokep db
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/fitur/group/antibokep.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if "ambangDb" in s:
              print("patch: antibokep db udah dipatch"); raise SystemExit(0)
          anchor = '    if (s.nude >= ambangNude || s.db >= 0.5) { console.log(`[antibokep] lokal nude=${s.nude} db=${s.db} hp=${s.hp} sexy=${s.sexy} -> PORNO`); return "PORNO" }'
          if anchor not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          baru = "    const ambangDb = opsi.tanpaRouter ? 0.5 : 0.9\n" + anchor.replace("s.db >= 0.5", "s.db >= ambangDb")
          s = s.replace(anchor, baru, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: ambang db instan 0.5 -> 0.9 (band tengah eskalasi visi); tanpaRouter tetap 0.5")
          PYEOF

      - name: Patch lanjutan mentions
        run: |
          python3 - <<'PYEOF'
          import io
          p = "wa33/conn.js"
          try:
              s = io.open(p, encoding="utf-8").read()
          except Exception as e:
              print("patch skip (baca gagal):", e); raise SystemExit(0)
          if "const disebut" in s:
              print("patch: lanjutan mentions udah dipatch"); raise SystemExit(0)
          anchor = "    for (const j of konten?.contextInfo?.mentionedJid || []) {"
          baru = "    const disebut = [...(konten?.contextInfo?.mentionedJid || []), ...(konten?.mentions || [])]\n    for (const j of disebut) {"
          if anchor not in s:
              print("patch skip (anchor hilang)"); raise SystemExit(0)
          s = s.replace(anchor, baru, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("patch: catatTagKeluar sekarang baca mentions top-level juga (welcome agrup dkk)")
          PYEOF

      - name: Tulis drive-x
        run: |
          cat > wa33/drive-x.mjs <<'EOF'
          import { create } from 'gdrive'
          const FOLDER = '1dvZpYvHScInnTVaMazZsPnGtE7aJZ20n' // wa33-backup
          const drive = await create({
            credentialsFile: './data/credentials.json',
            tokenFile: './data/token.json',
          })
          const [cmd, name, path] = process.argv.slice(2)
          const files = await drive.list(FOLDER)
          const found = files.find(f => f.name === name)
          if (cmd === 'get') {
            if (!found) { console.log(`⚠️ ${name} ga ada di Drive, skip`); process.exit(0) }
            const bytes = await drive.download(found.id, path)
            console.log(`⬇️ ${name}: ${bytes} bytes`)
          } else if (cmd === 'put') {
            if (found) await drive.remove(found.id)
            const up = await drive.upload(path, FOLDER)
            console.log(`⬆️ ${name} -> ${up.id}`)
          }
          EOF
          echo "drive-x siap"

      - name: Siapkan WARP
        run: |
          # Egress runner (Azure) kena bot-wall YouTube dll -> keluar lewat WARP
          # lokal mode proxy (SOCKS5 127.0.0.1:40000), pola yg sama kayak di VPS.
          # Identitas WARP persist di Drive (warp.tar.gz, diambil via drive-x).
          set +e
          curl -fsSL -m 180 -o /tmp/warp.deb "https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.8.2115.0_amd64.deb"
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/warp.deb || echo "⚠️ install warp gagal"
          if command -v warp-cli >/dev/null; then
            cd wa33
            rm -rf /tmp/warpseed && mkdir -p /tmp/warpseed
            node drive-x.mjs get warp.tar.gz /tmp/warp.tar.gz
            if [ -s /tmp/warp.tar.gz ]; then
              tar -xzf /tmp/warp.tar.gz -C /tmp/warpseed
              SEED=$(find /tmp/warpseed -name reg.json 2>/dev/null | head -1)
              if [ -n "$SEED" ]; then
                sudo systemctl stop warp-svc 2>/dev/null
                sudo mkdir -p /var/lib/cloudflare-warp
                sudo cp -a "$(dirname "$SEED")/." /var/lib/cloudflare-warp/
                echo "🌐 identitas WARP di-restore dari Drive"
              fi
            fi
            cd /home/runner
            sudo systemctl enable --now warp-svc 2>/dev/null || (sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &)
            sleep 5
            warp-cli --accept-tos registration new
            warp-cli --accept-tos mode proxy
            warp-cli --accept-tos connect
            for i in $(seq 1 20); do ss -tln | grep -q ":40000" && break; sleep 2; done
            if ss -tln | grep -q ":40000"; then
              echo "✅ WARP proxy denger di 127.0.0.1:40000"
              curl -s -m 15 --socks5 127.0.0.1:40000 "https://www.cloudflare.com/cdn-cgi/trace" | grep -E "warp=|loc=" || true
              if [ -z "$SEED" ]; then
                rm -rf /tmp/warpup && mkdir -p /tmp/warpup/warp
                sudo cp -a /var/lib/cloudflare-warp/. /tmp/warpup/warp/ && sudo chown -R runner:runner /tmp/warpup/warp
                tar -czf /tmp/warp.tar.gz -C /tmp/warpup warp
                (cd wa33 && node drive-x.mjs put warp.tar.gz /tmp/warp.tar.gz) || echo "⚠️ upload warp.tar.gz gagal"
              fi
            else
              echo "⚠️ WARP gak denger di 40000 — fitur jalan direct dulu (status quo)"
              warp-cli --accept-tos status || true
            fi
          fi
          exit 0

      - name: Restore profil Chrome + antibokep
        run: |
          cd wa33
          node drive-x.mjs get profiles.tar.gz /tmp/profiles.tar.gz || echo "⚠️ get profiles gagal"
          node drive-x.mjs get antibokep-ai.tar.gz /tmp/antibokep-ai.tar.gz || echo "⚠️ get antibokep gagal"
          cd /home/runner
          if [ -s /tmp/profiles.tar.gz ]; then
            tar -xzf /tmp/profiles.tar.gz -C /home/runner
            chmod 600 /home/runner/.config/pixiv-cookie.txt 2>/dev/null || true
            echo "✅ profil Chrome direstore"
          fi
          if [ -s /tmp/antibokep-ai.tar.gz ]; then
            tar -xzf /tmp/antibokep-ai.tar.gz -C /home/runner
            echo "✅ antibokep-ai direstore"
          fi

      - name: Restore venv antibokep
        id: cache-abv
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/antibokep-ai/venv
          key: ${{ runner.os }}-abvenv-v1

      - name: Siapkan antibokep-ai
        run: |
          if [ -f /home/runner/antibokep-ai/server.py ]; then
            if [ "${{ steps.cache-abv.outputs.cache-hit }}" != "true" ]; then
              python3 -m venv /home/runner/antibokep-ai/venv
              /home/runner/antibokep-ai/venv/bin/pip install -q nudenet==3.4.2 dghs-imgutils==0.19.0
            fi
            /home/runner/antibokep-ai/venv/bin/python -c "import nudenet, imgutils; print('✅ antibokep deps ok')"
          else
            echo "⚠️ antibokep-ai ga ada, skip (bot jalan tanpa lokal)"
          fi

      - name: Save venv antibokep
        if: steps.cache-abv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/antibokep-ai/venv
          key: ${{ runner.os }}-abvenv-v1

      - name: Siapkan bgutil-pot
        run: |
          if [ ! -f /home/runner/bgutil-pot/server/build/main.js ]; then
            git clone -q --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /home/runner/bgutil-pot
            cd /home/runner/bgutil-pot/server
            npm i --no-audit --no-fund
            npx tsc
          fi
          ls -la /home/runner/bgutil-pot/server/build/main.js

      - name: Update mywagua
        id: mywagua
        run: |
          SHA=$(git ls-remote https://github.com/frmdeveloper/mywagua HEAD | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Kunci cache
        id: kunci
        env:
          MW: ${{ steps.mywagua.outputs.sha }}
        run: |
          PJ=$(sha256sum wa33/package.json | cut -c1-12)
          echo "nm=${{ runner.os }}-wa33nm-v1-$PJ-${MW:0:12}" >> $GITHUB_OUTPUT

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/wa33/node_modules
          key: ${{ steps.kunci.outputs.nm }}
          restore-keys: ${{ runner.os }}-wa33nm-v1-

      - name: Install module
        run: |
          python -m pip install -U gallery-dl
          python -m pip install -U --pre "yt-dlp[default]"
          cd wa33
          if [ ! -f bantuan/ytdlp ]; then
            wget -O bantuan/ytdlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp"
            chmod +x bantuan/ytdlp
          fi
          npm pkg set dependencies.mywagua=github:frmdeveloper/mywagua#${{ steps.mywagua.outputs.sha }}
          if [ "${{ steps.cache-nm.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules dari cache, skip npm i"
            exit 0
          fi
          npm i --install-links

      - name: Save node_modules
        if: steps.cache-nm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/wa33/node_modules
          key: ${{ steps.kunci.outputs.nm }}

      - name: Tentukan nama node
        id: nama
        run: |
          if [ $(( ${{ github.run_number }} % 2 )) -eq 0 ]; then
            echo "h=ghact" >> $GITHUB_OUTPUT
          else
            echo "h=ghact2" >> $GITHUB_OUTPUT
          fi
          echo "node ini: $(cat $GITHUB_OUTPUT)"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ steps.nama.outputs.h }}

      - name: Sinyal ke Instance Lama
        run: |
          echo "🔍 Mencari instance lama..."

          OLD_RUN_ID=$(curl -sf \
            -H "Authorization: token ${{ secrets.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" \
            | WORKFLOW_NAME="${{ github.workflow }}" MY_ID="${{ github.run_id }}" \
              node -e "
          const chunks = []
          process.stdin.on('data', d => chunks.push(d))
          process.stdin.on('end', () => {
            const data = JSON.parse(chunks.join(''))
            const name = process.env.WORKFLOW_NAME
            const myId = parseInt(process.env.MY_ID)
            const old = data.workflow_runs?.find(r => r.id !== myId && r.name === name)
            if (old) process.stdout.write(String(old.id))
          })" 2>/dev/null || echo "")

          if [ -z "$OLD_RUN_ID" ]; then
            echo "💡 Tidak ada instance lama → mulai fresh"
            exit 0
          fi

          echo "✅ Instance lama: Run #$OLD_RUN_ID"

          echo "📡 Mencari di Tailscale..."
          MY_IP=$(tailscale ip -4 2>/dev/null)
          OLD_IP=""
          for i in $(seq 1 15); do
            OLD_IP=$(tailscale status --json 2>/dev/null \
              | MY_IP="$MY_IP" node -e "
          const chunks = []
          process.stdin.on('data', d => chunks.push(d))
          process.stdin.on('end', () => {
            try {
              const j = JSON.parse(chunks.join(''))
              const peers = Object.values(j.Peer || {})
              const old = peers.find(p => p.Online && /ghact|wa-bot-/.test((p.HostName || '') + ' ' + (p.DNSName || '')) && !(p.TailscaleIPs || []).includes(process.env.MY_IP))
              if (old) process.stdout.write(old.TailscaleIPs[0])
            } catch (e) {}
          })" 2>/dev/null || echo "")
            [ -n "$OLD_IP" ] && { echo "📡 Ketemu di $OLD_IP"; break; }
            echo "⏳ [$i/15] Belum ketemu, tunggu 5 detik..."
            sleep 5
          done

          if [ -z "$OLD_IP" ]; then
            echo "⚠️ Tidak ditemukan di Tailscale"
            exit 0
          fi

          echo "📨 Mengirim sinyal ke Action 1..."
          for i in $(seq 1 5); do
            RESPONSE=$(curl -sf --max-time 120 \
              -X POST "http://${OLD_IP}:8080/signal" 2>/dev/null)
            if [ "$RESPONSE" = "done" ]; then
              echo "✅ Action 1 sudah backup & mati, aman dilanjut!"
              break
            fi
            echo "⏳ [$i/5] Retry..."
            sleep 5
          done

      - name: run
        run: |
          echo "runner:oke" | sudo chpasswd
          cd wa33
          # Layanan pendamping: antibokep lokal, bgutil PO-token, Chrome #muse.
          if [ -f /home/runner/antibokep-ai/server.py ]; then
            screen -dmS antibokep bash -c 'cd /home/runner/antibokep-ai && HF_HOME=/home/runner/antibokep-ai/hfcache HF_HUB_OFFLINE=1 venv/bin/python server.py'
            echo "🛡️ antibokep-ai dinyalain"
          fi
          if [ -f /home/runner/bgutil-pot/server/build/main.js ]; then
            screen -dmS bgutil node /home/runner/bgutil-pot/server/build/main.js
            echo "🎫 bgutil-pot dinyalain"
          fi
          # VNC + IceWM: buat login manual Chrome pixiv doang (akses via Tailscale ghact:5901)
          mkdir -p /home/runner/.vnc
          printf '%s' "${{ secrets.VNC_PASS }}" | vncpasswd -f > /home/runner/.vnc/passwd || true
          chmod 600 /home/runner/.vnc/passwd
          screen -dmS vnc Xvnc :1 -geometry 1560x720 -depth 24 -rfbauth /home/runner/.vnc/passwd -rfbport 5901
          sleep 3
          screen -dmS wm env DISPLAY=:1 icewm
          ss -tln | grep 5901 || echo "⚠️ VNC ga listening di 5901"
          if [ -d /home/runner/.config/chrome-pixiv ]; then
            screen -dmS cpixiv env DISPLAY=:1 google-chrome --remote-debugging-port=9223 --user-data-dir=/home/runner/.config/chrome-pixiv --no-first-run --no-sandbox --disable-gpu about:blank
            echo "🌐 VNC :1 + chrome-pixiv GUI dinyalain (CDP 9223)"
          fi
          # Backup penuh berkala (wa33 + .9router) biar token antigravity &
          # state router ga basi kalo run ini mati paksa tanpa flush ghact.
          # ghact tetap ngurus sync realtime data/ + snapshot sesi WA.
          ( while true; do
              sleep 1200
              echo "⬆️ Backup berkala (wa33 + .9router)..."
              node gd.js backup || echo "⚠️ Backup berkala gagal, lanjut aja"
            done ) &
          BACKUP_LOOP=$!
          trap 'kill $BACKUP_LOOP 2>/dev/null || true' EXIT
          GH_EXIT=0
          node ghact.js || GH_EXIT=$?
          # Run selesai -> upload ulang profil Chrome biar sesi (muse/pixiv)
          # tetap fresh buat run penerus.
          pkill -f 'remote-debugging-port=9222' 2>/dev/null || true
          sleep 3
          if [ -d /home/runner/.config/chrome-muse ] || [ -d /home/runner/.config/chrome-pixiv ]; then
            tar -czf /tmp/profiles.tar.gz -C /home/runner \
              .config/chrome-muse .config/chrome-pixiv .config/pixiv-cookie.txt 2>/dev/null \
              && node drive-x.mjs put profiles.tar.gz /tmp/profiles.tar.gz \
              || echo "⚠️ Upload profil gagal, profil lama di Drive tetap aman"
          fi
          exit $GH_EXIT

  penerus:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Nyalain penerus
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.token }}
        run: |
          if [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "🛑 Run di-cancel → rantai BERHENTI. Nyalain manual kalo mau lanjut."
            exit 0
          fi
          MULAI=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.run_started_at')
          BARU=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=30" \
            | jq --arg m "$MULAI" --arg i "${{ github.run_id }}" --arg w "${{ github.workflow }}" \
              '[.workflow_runs[] | select(.name == $w and (.id|tostring) != $i and .run_started_at > $m)] | length')
          if [ "$BARU" -gt 0 ]; then
            echo "udah ada $BARU run lebih baru → run ini kena ganti, stop"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            UMUR=$(( ( $(date -u +%s) - $(date -u -d "$MULAI" +%s) ) / 60 ))
            echo "build gagal, run ini idup $UMUR menit"
            if [ "$UMUR" -lt 30 ]; then
              echo "gagal cepat (<30 menit) → kemungkinan gagal di setup, stop biar nggak loop"
              exit 1
            fi
          fi
          gh workflow run main.yml
          echo "penerus dijalanin"
